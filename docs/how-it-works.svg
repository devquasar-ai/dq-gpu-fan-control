<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6d28d9"/>
    </marker>
    <marker id="arrowRpm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0ea5e9"/>
    </marker>
  </defs>

  <style>
    .box { fill: #ffffff; stroke: #6d28d9; stroke-width: 2.5; rx: 14; }
    .dark { fill: #4c1d95; }
    .title { font-size: 26px; font-weight: 700; fill: #1f2937; }
    .boxTitle { font-size: 18px; font-weight: 700; fill: #4c1d95; }
    .boxSub  { font-size: 13px; fill: #4b5563; }
    .flow    { font-size: 13px; font-weight: 600; fill: #6d28d9; }
    .rpm     { font-size: 13px; font-weight: 600; fill: #0ea5e9; }
  </style>

  <rect width="1200" height="640" fill="#faf9fc"/>
  <text class="title" x="600" y="46" text-anchor="middle">How gpu-fan cools a fanless GPU</text>

  <!-- 1. GPU -->
  <g>
    <rect class="box" x="40" y="130" width="230" height="150" rx="14"/>
    <text class="boxTitle" x="155" y="170" text-anchor="middle">Passively cooled GPU</text>
    <text class="boxSub" x="155" y="198" text-anchor="middle">Tesla / A100 / CMP / MI</text>
    <text class="boxSub" x="155" y="220" text-anchor="middle">no fan of its own</text>
    <text class="boxSub" x="155" y="252" text-anchor="middle" font-weight="700" fill="#4c1d95">70 °C</text>
  </g>

  <!-- 2. nvidia-smi -->
  <g>
    <rect class="box" x="340" y="130" width="230" height="150" rx="14"/>
    <text class="boxTitle" x="455" y="170" text-anchor="middle">Temperature reader</text>
    <text class="boxSub" x="455" y="198" text-anchor="middle">one long-running</text>
    <text class="boxSub" x="455" y="220" text-anchor="middle">nvidia-smi -l process</text>
    <text class="boxSub" x="455" y="252" text-anchor="middle">no per-tick forks</text>
  </g>

  <!-- 3. daemon -->
  <g>
    <rect class="dark" x="640" y="110" width="270" height="190" rx="14" stroke="#4c1d95" stroke-width="2.5"/>
    <text x="775" y="150" text-anchor="middle" font-size="18px" font-weight="700" fill="#ffffff">gpu-fan daemon</text>
    <text x="775" y="178" text-anchor="middle" font-size="13px" fill="#ddd6fe">systemd service</text>
    <text x="775" y="208" text-anchor="middle" font-size="14px" font-weight="600" fill="#ffffff">profile curve</text>
    <text x="775" y="228" text-anchor="middle" font-size="12px" fill="#c4b5fd">silent / normal / performance / custom</text>
    <text x="775" y="256" text-anchor="middle" font-size="14px" font-weight="600" fill="#ffffff">failsafe logic</text>
    <text x="775" y="276" text-anchor="middle" font-size="12px" fill="#c4b5fd">any error → fan 100%</text>
  </g>

  <!-- 4. hwmon PWM -->
  <g>
    <rect class="box" x="980" y="130" width="180" height="150" rx="14"/>
    <text class="boxTitle" x="1070" y="166" text-anchor="middle">/sys/class/hwmon</text>
    <text class="boxSub" x="1070" y="194" text-anchor="middle">pwmX  (duty %)</text>
    <text class="boxSub" x="1070" y="216" text-anchor="middle">it87 / nct6775 ...</text>
    <text class="boxSub" x="1070" y="248" text-anchor="middle" font-weight="700" fill="#4c1d95">58%</text>
  </g>

  <!-- horizontal flow arrows -->
  <line x1="270" y1="205" x2="332" y2="205" stroke="#6d28d9" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text class="flow" x="301" y="195" text-anchor="middle">°C</text>

  <line x1="570" y1="205" x2="632" y2="205" stroke="#6d28d9" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text class="flow" x="601" y="195" text-anchor="middle">°C</text>

  <line x1="910" y1="205" x2="972" y2="205" stroke="#6d28d9" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text class="flow" x="941" y="195" text-anchor="middle">duty %</text>

  <!-- 5. Super I/O -->
  <g>
    <rect class="box" x="980" y="380" width="180" height="120" rx="14"/>
    <text class="boxTitle" x="1070" y="416" text-anchor="middle">Super I/O chip</text>
    <text class="boxSub" x="1070" y="444" text-anchor="middle">IT8689 / NCT6798</text>
    <text class="boxSub" x="1070" y="466" text-anchor="middle">generates PWM signal</text>
  </g>

  <!-- vertical arrow hwmon -> SuperIO -->
  <line x1="1070" y1="280" x2="1070" y2="372" stroke="#6d28d9" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text class="flow" x="1082" y="330">reg</text>

  <!-- 6. fan header + shroud fan -->
  <g>
    <rect class="box" x="640" y="380" width="270" height="120" rx="14"/>
    <text class="boxTitle" x="775" y="416" text-anchor="middle">Chassis fan header</text>
    <text class="boxSub" x="775" y="444" text-anchor="middle">shroud fan strapped</text>
    <text class="boxSub" x="775" y="466" text-anchor="middle">onto the passive GPU</text>
  </g>

  <line x1="972" y1="440" x2="918" y2="440" stroke="#6d28d9" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text class="flow" x="945" y="430" text-anchor="middle">PWM</text>

  <!-- RPM feedback -->
  <path d="M 632 470 C 520 470 520 560 640 560 L 1070 560 C 1130 560 1130 500 1070 500"
        fill="none" stroke="#0ea5e9" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrowRpm)"/>
  <text class="rpm" x="775" y="545" text-anchor="middle">RPM feedback (fanX_input) — stall detection</text>

  <!-- back to daemon: temperature loop -->
  <path d="M 340 240 C 240 240 240 330 340 330 L 740 330 C 800 330 800 310 775 308"
        fill="none" stroke="#6d28d9" stroke-width="0" />
  <!-- control loop annotation -->
  <g>
    <rect x="40" y="380" width="230" height="120" rx="14" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2" stroke-dasharray="6 5"/>
    <text class="boxTitle" x="155" y="416" text-anchor="middle">Closed control loop</text>
    <text class="boxSub" x="155" y="444" text-anchor="middle">read temp → compute duty</text>
    <text class="boxSub" x="155" y="466" text-anchor="middle">every INTERVAL seconds</text>
  </g>
  <path d="M 155 375 L 155 300 C 155 270 200 262 240 262" fill="none" stroke="#6d28d9" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>

</svg>
