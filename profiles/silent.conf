# Quiet: fan stops completely when the GPU is cool (needs a fan that stops at 0% PWM;
# check with `gpu-fan selftest`). Hysteresis: stops below 40°C, restarts at 46°C.
DESCRIPTION="fan off below 40°C, quiet ramp, 100% at 82°C"
CURVE="46:25 55:35 65:50 72:70 78:90 82:100"
MIN_PCT=25
STOP_BELOW=40
START_AT=46
STEP_DOWN=2
KICK_PCT=60
KICK_SECS=3
